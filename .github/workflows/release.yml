name: Auto-build & release complete package

# Triggers:
#   - schedule (daily 06:00 UTC): auto-detect the latest Wave Link Windows release on the
#     official Elgato release notes, download the MSIX from the Elgato CDN, build the
#     patched installer from the committed patch/ source in this repo, assemble a complete
#     package, and publish a release.
#   - workflow_dispatch: same as schedule, but always builds the latest (for validation)
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build patched installer + bundle MSIX
    runs-on: windows-latest
    steps:
      - name: Checkout this repo (release automation)
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect latest Wave Link & download MSIX
        id: detect
        shell: pwsh
        run: |
          $force = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '-Force' } else { '' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/detect-wavelink-msix.ps1 -OutputDir input -VersionFile wavelink-app-version.txt $force

      - name: Commit seen app version
        if: steps.detect.outputs.should_release == 'true' && github.event_name != 'push'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wavelink-app-version.txt
          $diff = git status --porcelain wavelink-app-version.txt
          if ($diff) {
            git commit -m "chore: track Wave Link app version ${{ steps.detect.outputs.app_version }}"
            git push
          } else {
            Write-Host "State unchanged; nothing to commit."
          }

      - name: Publish patched GUI installer (self-contained, single-file, win-x64)
        if: steps.detect.outputs.should_release == 'true'
        run: dotnet publish patch/src/WaveLinkWin10Setup/WaveLinkWin10Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -o dist

      - name: Assemble complete package
        if: steps.detect.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Copy-Item patch/driver  dist -Recurse -Force
          Copy-Item patch/scripts dist -Recurse -Force
          Copy-Item input        dist -Recurse -Force

      - name: Zip package
        if: steps.detect.outputs.should_release == 'true'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath wavelink-win10-complete.zip

      - name: Create GitHub Release
        if: steps.detect.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.release_tag }}
          name: Wave Link ${{ steps.detect.outputs.app_version }} (Win10 installer)
          files: wavelink-win10-complete.zip
          body: |
            Automated build triggered by the official Elgato Wave Link release notes.

            Bundle contents:
            - Self-contained patched GUI installer exe (no .NET runtime needed; built from the committed patch/ source in this repo)
            - Official Wave Link driver (from the committed patch/ source)
            - Wave Link ${{ steps.detect.outputs.app_version }} MSIX (downloaded from the Elgato CDN at build time)
            - Helper scripts

            Note: the MSIX is Elgato proprietary software. It is fetched from the official CDN at build time and bundled into this release archive; it is not modified or re-hosted as a standalone file.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
